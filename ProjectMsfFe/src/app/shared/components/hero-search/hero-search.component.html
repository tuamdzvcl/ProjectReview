<section class="hero">
  <h1>Khám phá các sự kiện dành cho tất cả những điều bạn yêu thích.</h1>

  <div class="search-box">
    <input
      maxlength="100"
      type="text"
      placeholder="Hãy nhập tên sự kiện bạn muốn tìm"
      [(ngModel)]="keyword"
      (keyup.enter)="searchTitleEvent()"
    />
    <button (click)="searchTitleEvent()">Tìm kiếm</button>
  </div>
</section>
